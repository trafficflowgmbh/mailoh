name: build

# Everything the two clients can honestly prove on a public runner.
#
#   macOS   — the SwiftUI app: compiles in release, tests pass, it actually
#             renders (--smoke), and it packages into an installable DMG.
#   windows — the Tauri shell: the UI bundle builds, the embedded-bundle smoke
#             passes, and it packages into an .msi and an NSIS .exe.
#   linux   — the same shell into an .AppImage and a .deb.
#
# Nothing here is signed: no Apple Developer ID, no Authenticode certificate.
# See the per-platform "unsigned" notes in the README; the macOS artifact is
# ad-hoc signed only, the Windows and Linux ones are not signed at all.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS · build · test · smoke · dmg
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version
          sw_vers

      - name: swift build -c release
        run: swift build --package-path apps/macos -c release

      - name: swift test
        run: swift test --package-path apps/macos

      # The render check: every route × both colour schemes × both verified
      # widths, hosted offscreen, rasterised, and audited for collapsed rows.
      # It is the step that catches "compiles, lays out, draws nothing".
      - name: OhMail --smoke
        run: swift run --package-path apps/macos -c release OhMail --smoke

      - name: Package ohmail.app + ohmail.dmg
        env:
          OHMAIL_BUILD_VERSION: ${{ github.run_number }}
        run: ./scripts/package-app.sh

      # A DMG that does not mount is not an artifact. Mount it, look inside,
      # unmount. If this ever fails the upload below never happens.
      - name: Verify the DMG mounts and contains the app
        run: |
          set -euo pipefail
          MNT="$(mktemp -d)"
          hdiutil attach build/ohmail.dmg -nobrowse -readonly -mountpoint "$MNT"
          ls -la "$MNT"
          test -d "$MNT/ohmail.app"
          test -x "$MNT/ohmail.app/Contents/MacOS/OhMail"
          test -s "$MNT/ohmail.app/Contents/Resources/ohmail.icns"
          test -f "$MNT/Read me first.txt"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$MNT/ohmail.app/Contents/Info.plist"
          codesign --verify --verbose=2 "$MNT/ohmail.app"
          lipo -archs "$MNT/ohmail.app/Contents/MacOS/OhMail"
          hdiutil detach "$MNT"

      - name: Screenshots (every route, light + dark, both widths)
        run: swift run --package-path apps/macos -c release OhMail --shot shots

      - name: Upload ohmail.dmg
        uses: actions/upload-artifact@v7
        with:
          name: ohmail-dmg-${{ github.run_number }}
          path: build/ohmail.dmg
          if-no-files-found: error

      - name: Upload ohmail.app (zipped, ad-hoc signature preserved)
        run: ditto -c -k --keepParent build/ohmail.app build/ohmail.app.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ohmail-app-${{ github.run_number }}
          path: build/ohmail.app.zip
          if-no-files-found: error

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.run_number }}
          path: shots
          if-no-files-found: error

      # So a downloader can check what they got against what this run made.
      - name: Run summary
        if: always()
        run: |
          {
            echo '### ohmail — unsigned preview build'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA:0:9}\` |"
            echo "| toolchain | $(xcodebuild -version | tr '\n' ' ') · $(swift --version 2>&1 | head -1) |"
            echo "| runner | macOS $(sw_vers -productVersion) $(uname -m) |"
            [ -f build/ohmail.dmg ] && {
              echo "| architectures | $(lipo -archs build/ohmail.app/Contents/MacOS/OhMail) |"
              echo "| DMG sha256 | \`$(shasum -a 256 build/ohmail.dmg | cut -d' ' -f1)\` |"
              echo "| DMG size | $(du -h build/ohmail.dmg | cut -f1) |"
            }
            echo
            echo 'Ad-hoc signed, **not** notarized: first launch needs right-click → Open.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # The Tauri shell (apps/desktop). Windows and Linux run the same five steps
  # in the same order — install, typecheck, build the UI bundle, smoke the
  # built bundle, then package — because the only thing that differs between
  # them is the packaging toolchain. The UI is built BEFORE tauri so a broken
  # interface fails in its own red step instead of inside a Rust build log.
  # ==========================================================================

  windows:
    name: Windows · ui · smoke · msi + nsis
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Toolchain
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version
          node --version

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: tsc --noEmit
        run: npm run ui:typecheck

      - name: Build the UI bundle
        run: npm run ui:build

      # The render check: the built bundle, executed, audited for content, for
      # collapsed mail, and for so much as an attempt to open a connection.
      - name: Smoke the embedded bundle
        run: npm run smoke

      - name: tauri build (msi + nsis)
        run: npx tauri build --bundles msi,nsis

      - name: Inspect what was produced
        run: |
          set -euo pipefail
          B=src-tauri/target/release/bundle
          ls -la "$B/msi" "$B/nsis"
          MSI="$(ls "$B"/msi/*.msi | head -1)"
          EXE="$(ls "$B"/nsis/*-setup.exe | head -1)"
          test -s "$MSI"
          test -s "$EXE"

          # ── The installers must not fetch the WebView2 runtime ────────────
          # tauri.conf.json sets bundle.windows.webviewInstallMode to "skip".
          # Tauri's DEFAULT is downloadBootstrapper, which compiles a WiX custom
          # action into the .msi (`DownloadAndInvokeBootstrapper` — a hidden
          # powershell.exe running Invoke-WebRequest against go.microsoft.com,
          # sequenced under NOT(REMOVE OR INSTALLED_WEBVIEW2_VERSION)) and an
          # `NSISdl::download` step into the -setup.exe. A product that says it
          # cannot reach the network must not ship an installer that does, so
          # this is asserted against the built artifacts rather than trusted
          # from the config. Every one of these greps matched a real 0.1.0
          # installer built before the config key was set, and none of them
          # matches one built after — checked by hand on both, not assumed.
          #
          # `skip` drops the whole `{{#if install_webview}}` section, so the
          # INSTALLED_WEBVIEW2_VERSION property and its three RegistrySearch
          # rows go with it. That makes its absence the broadest single check
          # available here: it fails if any WebView2 install mode comes back,
          # not only the downloading ones.
          echo "--- .msi: no WebView2 downloader ---"
          # MSI string pools are uncompressed, so grep -a sees them directly.
          ! grep -aq 'DownloadAndInvokeBootstrapper' "$MSI"
          ! grep -aqi 'fwlink' "$MSI"
          ! grep -aqi 'go.microsoft.com' "$MSI"
          ! grep -aqi 'MicrosoftEdgeWebview2Setup' "$MSI"
          ! grep -aqi 'Invoke-WebRequest' "$MSI"
          ! grep -aq 'INSTALLED_WEBVIEW2_VERSION' "$MSI"

          echo "--- nsis: no WebView2 install step ---"
          # The NSIS payload is LZMA-compressed, so unpack it and look at what
          # the installer would actually drop on disk. Two checks, one per
          # failure mode: NSIS packs a plugin DLL only when a call to it is
          # compiled, and `NSISdl::download` lives inside
          # `!if INSTALLWEBVIEW2MODE == "downloadBootstrapper"`, so NSISdl.dll
          # present ⇒ the downloader is back; and embedBootstrapper /
          # offlineInstaller would `File` a MicrosoftEdgeWebview2Setup.exe into
          # the payload, so any file carrying that name is the other regression.
          # Verified against a real pre-fix installer: NSISdl.dll was there.
          # A relative path on purpose: 7z is a Windows binary and find/grep are
          # MSYS, and they disagree about D:\-style paths.
          rm -rf nsis-unpacked
          7z x -y -onsis-unpacked "$EXE" > /dev/null
          find nsis-unpacked
          # Collected into variables and tested for emptiness, rather than
          # `! <producer> | grep -q .`. That form can fail in the direction that
          # matters. When there IS something to find, `grep -q` exits at the
          # first line; if the producer is still writing after that it dies on
          # the closed pipe, `pipefail` makes the pipeline non-zero, and the
          # leading `!` turns that into a PASS — green exactly when the
          # downloader is back.
          #
          # It depends on how much the producer writes, because everything up to
          # the pipe buffer lands before grep can exit. Measured, with the string
          # present in every file: 200 files (8 KB of paths) failed correctly;
          # 4 000 files (168 KB) and 20 000 files (840 KB) both PASSED. So one
          # stray bootstrapper is caught and a broad regression need not be,
          # which is the worst way round. The variable form has no pipe and no
          # threshold.
          NSISDL="$(find nsis-unpacked -iname 'NSISdl.dll')"
          test -z "$NSISDL"
          BOOTSTRAPPER="$(grep -rlai 'MicrosoftEdgeWebview2Setup' nsis-unpacked || true)"
          test -z "$BOOTSTRAPPER"
          rm -rf nsis-unpacked

          BIN=src-tauri/target/release/ohmail.exe
          test -s "$BIN"
          # The UI is embedded uncompressed on purpose (see src-tauri/Cargo.toml),
          # so the shipped binary can be audited without being run. `grep -a`
          # rather than `strings`, which Git Bash does not ship.
          grep -aq 'Ohbox' "$BIN"
          grep -aq 'Giulia Ferrari' "$BIN"
          grep -aq "connect-src 'none'" "$BIN"
          echo "URLs in the binary:"
          grep -aoE 'https?://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+' "$BIN" | sort -u
          # Both READMEs list these strings ONE BY ONE and say there are 15.
          # A claim that specific has to be enforced or it rots: if a Rust,
          # wry or React bump changes the set, this line goes red and whoever
          # bumps it updates the list. That is the intended cost, and it has
          # been paid once: 14 became 15 when the rich text editor entered the
          # bundle and brought ProseMirror's documentation link with it, in a
          # thrown message. Third-party docs, like React's beside it.
          URLS=$(grep -aoE 'https?://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+' "$BIN" | sort -u | wc -l)
          echo "unique URL strings: $URLS (expected 15)"
          test "$URLS" -eq 15
          # Nothing may point at ohmail infrastructure.
          ! grep -aoE 'https?://[A-Za-z0-9._~:/?#-]+' "$BIN" | grep -Ei 'ohmail|mailoh|trafficflow'

      - name: Upload the .msi
        uses: actions/upload-artifact@v7
        with:
          name: ohmail-msi-${{ github.run_number }}
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload the setup .exe (NSIS)
        uses: actions/upload-artifact@v7
        with:
          name: ohmail-nsis-${{ github.run_number }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Run summary
        if: always()
        run: |
          {
            echo '### ohmail for Windows — unsigned preview build'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA:0:9}\` |"
            echo "| toolchain | $(rustc --version) · node $(node --version) |"
            for f in src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*-setup.exe; do
              [ -f "$f" ] || continue
              echo "| $(basename "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` · $(du -h "$f" | cut -f1) |"
            done
            echo
            echo 'Not signed with an Authenticode certificate: SmartScreen will warn on first run.'
            echo 'Choose **More info → Run anyway**.'
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux · ui · smoke · appimage + deb
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Tauri's Linux prerequisites: the WebKitGTK webview it renders in, the
      # GTK/soup stack under it, and the tools its bundlers shell out to.
      - name: Install the Tauri prerequisites
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            build-essential curl wget file patchelf desktop-file-utils

      - name: Toolchain
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version
          node --version

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: tsc --noEmit
        run: npm run ui:typecheck

      - name: Build the UI bundle
        run: npm run ui:build

      - name: Smoke the embedded bundle
        run: npm run smoke

      - name: tauri build (appimage + deb)
        # NO_STRIP: linuxdeploy strips the binary again while assembling the
        # AppImage, and on recent glibc that step is a known failure. The Rust
        # release profile already strips (src-tauri/Cargo.toml), so nothing is
        # lost — and the embedded UI stays readable either way, which is the
        # property the audit below depends on.
        env:
          NO_STRIP: "true"
        run: npx tauri build --bundles appimage,deb

      - name: Inspect what was produced
        run: |
          set -euo pipefail
          B=src-tauri/target/release/bundle
          ls -la "$B/appimage" "$B/deb"
          APP="$(ls "$B"/appimage/*.AppImage | head -1)"
          DEB="$(ls "$B"/deb/*.deb | head -1)"
          test -s "$APP"
          test -x "$APP"
          test -s "$DEB"

          echo "--- .deb control ---"
          dpkg-deb -I "$DEB"
          # Read the listing ONCE, into a variable, and match against that.
          #
          # Not four `dpkg-deb -c "$DEB" | grep -q …` pipelines, which is what
          # this was: `grep -q` exits at its first match and closes the pipe,
          # and the tar subprocess behind dpkg-deb then dies writing to it —
          # `tar: stdout: write error`, `dpkg-deb: error: tar subprocess
          # returned error exit status 2`. `pipefail` turns that into a failed
          # step, so a passing assertion reported a broken build. Whether it
          # happens depends on where the match sits relative to what tar has
          # already flushed, so it passed most runs and failed some.
          CONTENTS="$(dpkg-deb -c "$DEB")"
          echo "--- .deb contents ---"
          printf '%s\n' "$CONTENTS"
          # dpkg-deb lists paths with no leading slash, so anchor on the space
          # that ends the tar columns instead.
          grep -qE ' usr/bin/ohmail$' <<< "$CONTENTS"
          grep -qiE ' usr/share/applications/.+\.desktop$' <<< "$CONTENTS"
          grep -qiE ' usr/share/icons/hicolor/128x128/apps/.+\.png$' <<< "$CONTENTS"
          # The bundler kebab-cases productName to get the package name. Since
          # productName is `ohmail`, so is the package — `apt remove ohmail`
          # works, and it matches /usr/bin/ohmail and the AppImage. Pinned so a
          # future Tauri that changes the slug goes red rather than stale.
          test "$(dpkg-deb -f "$DEB" Package)" = "ohmail"

          BIN=src-tauri/target/release/ohmail
          test -s "$BIN"
          grep -aq 'Ohbox' "$BIN"
          grep -aq 'Giulia Ferrari' "$BIN"
          grep -aq "connect-src 'none'" "$BIN"
          echo "URLs in the binary:"
          grep -aoE 'https?://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+' "$BIN" | sort -u
          # See the Windows job: the READMEs enumerate these, so the count is
          # pinned and a toolchain bump that changes it must update the list.
          # 13 became 14 with ProseMirror's documentation link, which arrived
          # with the rich text editor.
          URLS=$(grep -aoE 'https?://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+' "$BIN" | sort -u | wc -l)
          echo "unique URL strings: $URLS (expected 14)"
          test "$URLS" -eq 14
          # Nothing may point at ohmail infrastructure.
          ! grep -aoE 'https?://[A-Za-z0-9._~:/?#-]+' "$BIN" | grep -Ei 'ohmail|mailoh|trafficflow'

      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: ohmail-appimage-${{ github.run_number }}
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload the .deb
        uses: actions/upload-artifact@v7
        with:
          name: ohmail-deb-${{ github.run_number }}
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Run summary
        if: always()
        run: |
          {
            echo '### ohmail for Linux — unsigned preview build'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA:0:9}\` |"
            echo "| toolchain | $(rustc --version) · node $(node --version) |"
            echo "| runner | $(. /etc/os-release; echo "$PRETTY_NAME") $(uname -m) |"
            for f in src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb; do
              [ -f "$f" ] || continue
              echo "| $(basename "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` · $(du -h "$f" | cut -f1) |"
            done
            echo
            echo 'Unsigned and without a repository: `chmod +x` the AppImage before running it.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # The engine — packages/{core,api,db,services,db-mail} and apps/{sidecar,worker}.
  # Every job above PACKAGES the app; none of them reads the engine source the
  # app now carries. This one does. It installs the locked dependency tree,
  # TYPECHECKS the engine against a generated tsconfig, then BUILDS the one-file
  # bundle from the published source. A green here is evidence the published
  # engine compiles and bundles on a clean machine — not merely that a packager
  # ran over source no job ever read.
  # ==========================================================================
  engine:
    name: engine · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # From the committed package-lock.json, so the dependency tree is the same
      # on every machine — the reproducibility the exact-pinned manifests promise.
      - name: Install the locked dependency tree
        run: npm ci --no-audit --no-fund

      # typescript AND every @types package in ONE install: a second `npm install
      # --no-save` prunes what an earlier one added, after which `npx tsc` fetches
      # the unrelated `tsc` package. The @types back the engine's `node:` and
      # untyped-dependency imports; the runtime deps ship their own declarations.
      - name: Typecheck the engine source
        run: |
          npm install --no-save \
            typescript@5.6 \
            @types/node@^22.10.0 \
            @types/nodemailer@^6.4.16 \
            @types/mailparser@^3.4.0 \
            @types/sanitize-html@^2.16.1
          ./node_modules/.bin/tsc --noEmit -p tsconfig.engine.json

      # Build the one-file engine from the published source. esbuild is pinned —
      # the bundler asserts its own version — and installed off to one side so it
      # is never a project dependency.
      - name: Build the engine bundle
        run: |
          D="$(mktemp -d)" && (cd "$D" && npm install --no-save esbuild@0.24.0)
          OHMAIL_ESBUILD_FROM="$D" node scripts/engine-bundle.mjs

      - name: Confirm the bundle and its runtime layout
        run: |
          set -euo pipefail
          test -x build/engine/MacOS/ohmail-engine
          test -f build/engine/MacOS/ohmail-engine.meta.json
          test -d build/engine/drizzle
          test -d build/engine/MacOS/node_modules/@electric-sql/pglite
          echo "engine bundle sha256: $(sha256sum build/engine/MacOS/ohmail-engine | cut -d' ' -f1)"

      - name: Run summary
        if: always()
        run: |
          {
            echo '### ohmail engine — typecheck + build'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA:0:9}\` |"
            echo "| node | $(node --version) |"
            [ -x build/engine/MacOS/ohmail-engine ] \
              && echo "| engine bundle sha256 | \`$(sha256sum build/engine/MacOS/ohmail-engine | cut -d' ' -f1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
