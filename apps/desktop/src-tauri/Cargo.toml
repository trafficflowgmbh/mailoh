[package]
name = "ohmail"
version = "0.1.0"
description = "ohmail — consent-first email. Windows/Linux preview shell."
authors = ["TrafficFlow GmbH <support@ohmail.app>"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.82"

# The binary the installers ship. Named for the product, which is written lower-case,
# and it is also the Linux command: the .deb puts it at /usr/bin/ohmail and CI asserts
# that. The .deb's own `Package:` field does NOT come from here — Tauri kebab-cases
# `productName` in tauri.conf.json — but that is "ohmail" too, so the two agree.
[[bin]]
name = "ohmail"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2's default feature set MINUS `compression`, and nothing added.
#
# Dropping brotli costs about a quarter of a megabyte in the installer and buys
# the thing this product is actually selling: a binary anyone can audit without
# running it. With compression on, the embedded UI is an opaque blob — you
# cannot grep a downloaded .msi for the URLs it contains, so "it talks to
# nobody" would be a claim rather than a check. Uncompressed, it is a check:
#
#     strings ohmail.exe | grep -E 'https?://'
#
# returns thirteen strings on Linux and fourteen on Windows, every one of them a
# W3C namespace constant, a documentation link in a panic message, or the `http`
# crate's "http://" literal glued to the next string in rodata. The READMEs list
# all of them, and CI fails the build if one of them ever names ohmail or
# TrafficFlow infrastructure. See the README's "Verify it yourself".
#
# Nothing here opens a socket, reads the filesystem or spawns a process:
# src/main.rs is eleven lines and capabilities/main.json grants the webview
# nothing at all.
tauri = { version = "2", default-features = false, features = [
    "wry",
    "common-controls-v6",
    "dynamic-acl",
    "x11",
    "dbus",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
